name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (preinstalled on the runner)
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk PrayerTime.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: مواقيت الصلاة – تطبيق أندرويد (أحدث إصدار)
          body: |
            حمّل PrayerTime.apk على هاتف أندرويد وثبّته، ثم افتح التطبيق واضغط «إضافة الودجت».
            Build ${{ github.run_number }}
          files: PrayerTime.apk
          make_latest: true
