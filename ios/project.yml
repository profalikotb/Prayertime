name: PrayerTime
options:
  bundleIdPrefix: com.profalikotb
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ar
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.4.0
targets:
  PrayerTime:
    type: application
    platform: iOS
    sources:
      - path: PrayerTime
    dependencies:
      - package: Adhan
    info:
      path: PrayerTime/Info.plist
      properties:
        CFBundleDisplayName: "مواقيت الصلاة"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        NSAlarmKitUsageDescription: "لتشغيل تنبيهك الصوتي قبل الصلاة وأذان الشيخ محمد رفعت في موعده، حتى في الوضع الصامت."
        NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة لمكانك الحالي."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.profalikotb.prayertime
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
