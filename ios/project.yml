name: PrayerTime
options:
  bundleIdPrefix: com.profalikotb
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ar
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.4.0
targets:
  PrayerTime:
    type: application
    platform: iOS
    sources:
      - path: PrayerTime
    dependencies:
      - package: Adhan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.profalikotb.prayertime
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "مواقيت الصلاة"
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "لتشغيل تنبيهك الصوتي قبل الصلاة وأذان الشيخ محمد رفعت في موعده، حتى في الوضع الصامت."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة لمكانك الحالي."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
